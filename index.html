<!DOCTYPE html><html lang=uk><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>AJAX Users</title><link rel=stylesheet href=/lesson_16/hw-16.d538dfd9.css><body>
    <div class="backdrop is-hidden">
        <div class=modal>
            <h2>Edit user</h2>
            <form id="userForm modal-form">
                <div class=form-group>
                    <label for=name> Name </label>
                    <input id=name name=name placeholder required>
                </div>
                <div class=form-group>
                    <label for=email> Email </label>
                    <input id=email name=email type=email placeholder required>
                </div>
                <div class=form-group>
                    <label for=age> Age </label>
                    <input id=age name=age type=number placeholder required>
                </div>
                <button class="button button--danger" type=button data-close-modal>Cancel</button>
                <button type="button save-btn" class=button>Save</button>
            </form>
        </div>
    </div>
    <main class=container>
        <header class=header>
            <div>
                <p class=eyebrow>AJAX Practice</p>
                <h1>Users</h1>
            </div>
            <button class="button button--secondary" id=refresh type=button>
                Refresh
            </button>
        </header>
        <section class=create-user>
            <h2>Add user</h2>
            <form id=userForm>
                <div class=form-group>
                    <label for=name> Name </label>
                    <input id=name name=name placeholder="John Doe" required>
                </div>
                <div class=form-group>
                    <label for=email> Email </label>
                    <input id=email name=email type=email placeholder=john@gmail.com required>
                </div>
                <div class=form-group>
                    <label for=age> Age </label>
                    <input id=age name=age type=number placeholder=25 min=1 required>
                </div>
                <button class=button>Add user</button>
            </form>
        </section>
        <section class=users>
            <div class=users__header>
                <h2>Users list</h2>
                <p id=loader hidden>Loading...</p>
            </div>
            <p class=error id=error hidden></p>
            <div class=users__list id=usersList></div>
            <button type=button class=prev-btn>previous page</button>
            <button type=button class=next-btn>next page</button>
        </section>
    </main>
    <script src=/lesson_16/hw-16.6f279dd5.js type=module></script>
